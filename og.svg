<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MarammatBook — from intake to ready for pickup. A KARYA studio build.">
  <title>MarammatBook — from intake to ready for pickup</title>

  <!-- workshop paper base -->
  <rect width="1200" height="630" fill="#F4F6F5"/>

  <!-- faint job-book rules -->
  <g stroke="#E0E2DE" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- teal accent band down the left, like a job-book margin -->
  <rect x="0" y="0" width="18" height="630" fill="#0d9488"/>
  <rect x="90" y="0" width="2" height="630" fill="#D5E8E4"/>

  <!-- logo mark: job book + wrench -->
  <g transform="translate(96,74)">
    <rect x="0" y="0" width="72" height="66" rx="8" fill="#0d9488"/>
    <rect x="0" y="0" width="19" height="66" rx="8" fill="#0a6d64"/>
    <path d="M52 20l-6.4 6.4 4.8 4.8 6.4-6.4a8.4 8.4 0 0 1-11.4 10.7l-12.2 12.2a3.9 3.9 0 0 1-5.5-5.5l12.2-12.2A8.4 8.4 0 0 1 52 20z" fill="#F4F6F5"/>
  </g>

  <!-- brand name -->
  <text x="188" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#132321">Marammat</tspan><tspan fill="#0d9488">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#132321">From intake to</text>
  <text x="96" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#0d9488">ready for pickup.</text>

  <!-- tagline -->
  <text x="98" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="500" fill="#435551">Job intake, status board, parts &amp; warranty log for mobile &amp; electronics repair shops.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#0d9488"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#F4F6F5">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#435551">studio build · subscription · pricing on discovery</text>
  </g>

  <!-- mini job-card chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="200" rx="16" fill="#FFFFFF" stroke="#C6D6D1" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#132321">Job #MB-2043</text>
    <rect x="240" y="24" width="52" height="26" rx="13" fill="#D5E8E4"/>
    <text x="266" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0a6d64">Live</text>

    <text x="24" y="92" font-family="-apple-system, sans-serif" font-size="17" fill="#435551">iPhone 12 · screen</text>
    <rect x="204" y="76" width="88" height="24" rx="12" fill="#0d9488"/>
    <text x="248" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F4F6F5">Ready</text>

    <text x="24" y="132" font-family="-apple-system, sans-serif" font-size="17" fill="#435551">Redmi 10 · display</text>
    <rect x="164" y="116" width="128" height="24" rx="12" fill="#F3E3D6"/>
    <text x="228" y="133" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#B4531F">Awaiting parts</text>

    <line x1="24" y1="156" x2="288" y2="156" stroke="#E0E2DE" stroke-width="2"/>
    <text x="24" y="182" font-family="-apple-system, sans-serif" font-size="14" fill="#435551">On the bench</text>
    <text x="288" y="182" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#0d9488">7 jobs</text>
  </g>
</svg>
